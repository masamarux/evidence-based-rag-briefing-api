services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg18-trixie
    container_name: evidence-rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - evidence_rag_postgres_data:/var/lib/postgresql

volumes:
  evidence_rag_postgres_data: